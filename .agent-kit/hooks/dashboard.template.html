<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="60">
<title>Dashboard Loop</title>
<!--
  dashboard.template.html — SATU-SATUNYA penulis UI dashboard AI Engineering Loop.
  Data ditanam oleh dashboard.ps1 / dashboard.sh ke <script id="data"> di bawah; seluruh angka
  dihitung di sini dari data itu, dengan filter rentang dan repo yang mencakup SEMUA panel.

  Palet: instance referensi skill dataviz, mode dark, divalidasi scripts/validate_palette.js
  2026-09-07: 6 slot kategorikal (#3987e5,#d95926,#199e70,#c98500,#d55181,#008300) PASS semua
  gerbang; 2 slot dibuka/merged (#3987e5,#d95926) PASS. Status (good/warning/serious/critical)
  tetap, tidak dipakai sebagai seri. Font monospace adalah substitusi sadar atas "system sans"
  referensi, mengikuti rujukan pemilik (World Monitor); nilai besar tetap proporsional.
-->
<style>
:root{
  --page:#0d0d0d; --surface:#1a1a19; --border:rgba(255,255,255,.10);
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s-lain:#898781;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink-2);font:13px/1.5 var(--mono)}
a{color:var(--ink-2)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--border)}
header h1{margin:0;font-size:13px;letter-spacing:.14em;color:var(--ink);font-weight:600}
header .waktu{color:var(--muted)}
.filter{display:flex;gap:6px;align-items:center;margin-left:auto}
.filter label{color:var(--muted);letter-spacing:.08em;font-size:11px}
.filter button,.filter select{font:inherit;background:var(--surface);color:var(--ink-2);border:1px solid var(--border);border-radius:4px;padding:4px 10px;cursor:pointer}
.filter button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink-2);font-weight:600}
main{padding:16px 20px;display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
section{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px 14px;min-width:0}
section h2{margin:0 0 10px;font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
section h2 .sub{letter-spacing:0;text-transform:none;color:var(--muted);font-weight:normal;margin-left:auto}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}
@media (max-width:1000px){.c8,.c6,.c4{grid-column:span 12}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{padding:8px 10px;border:1px solid var(--border);border-radius:4px;background:var(--page)}
.tile .l{font-size:11px;color:var(--muted);letter-spacing:.06em}
.tile .v{font-size:24px;color:var(--ink);font-weight:600;line-height:1.2}
.tile .d{font-size:11px;color:var(--muted)}
.tile .d.up{color:var(--good)}.tile .d.down{color:var(--serious)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--ink-2);margin-top:6px}
.legend .k{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.legend .r{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend .n{color:var(--muted)}
svg text{font:11px var(--mono);fill:var(--muted)}
.chart{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--page);border:1px solid var(--border);border-radius:4px;padding:6px 8px;font-size:11px;color:var(--ink-2);display:none;min-width:120px;z-index:2}
.tip b{color:var(--ink);font-size:13px}
.tip .k{display:inline-block;width:10px;border-top:2px solid;vertical-align:middle;margin-right:5px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:11px;letter-spacing:.06em}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:6px}
th{text-align:left;color:var(--muted);font-weight:normal;font-size:11px;letter-spacing:.06em;border-bottom:1px solid var(--grid);padding:5px 6px}
td{padding:5px 6px;border-bottom:1px solid var(--grid);vertical-align:top}
td.num,th.num{text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);border-radius:3px;padding:2px 8px;font-size:11px;color:var(--ink-2);background:var(--page)}
.chip b{color:var(--ink)}
.status{display:inline-flex;align-items:center;gap:5px}
.status i{font-style:normal;font-weight:700}
.status.good i{color:var(--good)}.status.serious i{color:var(--serious)}.status.warning i{color:var(--warning)}.status.muted i{color:var(--muted)}
.kosong{color:var(--muted);padding:8px 0}
.peringatan{color:var(--warning);font-size:11px}
footer{padding:10px 20px 20px;color:var(--muted);font-size:11px;border-top:1px solid var(--border)}
.basi td:first-child{color:var(--warning);font-weight:700}.aktif td:first-child{color:var(--good)}.selesai{color:var(--muted)}
</style>
</head>
<body>
<script id="data" type="application/json">__DASHBOARD_DATA__</script>

<header>
  <h1>AI ENGINEERING LOOP</h1>
  <span class="waktu" id="waktu"></span>
  <div class="filter" role="group" aria-label="Filter">
    <label>RENTANG</label>
    <button type="button" data-rentang="7" aria-pressed="true">7 hari</button>
    <button type="button" data-rentang="14" aria-pressed="false">14 hari</button>
    <button type="button" data-rentang="30" aria-pressed="false">30 hari</button>
    <label>REPO</label>
    <select id="repo"><option value="">semua</option></select>
  </div>
</header>

<main>
  <section class="c12"><h2>SHIPPED <span class="sub" id="shipped-sub"></span></h2>
    <div class="tiles" id="shipped-tiles"></div>
    <div class="chart" id="shipped-chart" style="margin-top:12px"></div>
    <div class="legend" id="shipped-legend"></div>
    <details><summary>TABEL</summary><div id="shipped-table"></div></details>
  </section>

  <section class="c6"><h2>MIX <span class="sub">PR merged, dari prefiks judul</span></h2>
    <div class="chart" id="mix-chart"></div>
    <div class="legend" id="mix-legend"></div>
    <details><summary>TABEL</summary><div id="mix-table"></div></details>
  </section>

  <section class="c6"><h2>HOTSPOTS <span class="sub">scope di judul PR merged</span></h2>
    <div class="chips" id="hotspots"></div>
    <p class="peringatan" id="hotspots-catatan"></p>
  </section>

  <section class="c8"><h2>LOOP <span class="sub">brief → judge → PR (data lokal, sejak kit 1.15.0)</span></h2>
    <div class="tiles" id="loop-tiles"></div>
    <div id="loop-list"></div>
  </section>

  <section class="c4"><h2>CYCLE <span class="sub">dibuka → merged</span></h2>
    <div class="tiles" id="cycle-tiles"></div>
    <details><summary>PER REPO</summary><div id="cycle-table"></div></details>
  </section>

  <section class="c4"><h2>BASELINE TEST</h2>
    <div class="tiles" id="baseline-tiles"></div>
  </section>

  <section class="c8"><h2>SESI <span class="sub" id="sesi-sub"></span></h2>
    <div id="sesi-table"></div>
  </section>
</main>

<footer id="kaki"></footer>

<script>
(function(){
  'use strict';
  var DATA;
  try { DATA = JSON.parse(document.getElementById('data').textContent); } catch (e) { DATA = null; }
  var $ = function(id){ return document.getElementById(id); };
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = String(text); return e; }
  function clear(node){ while (node.firstChild) node.removeChild(node.firstChild); }
  function svgEl(tag, attrs){ var e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
  function pad2(n){ return (n < 10 ? '0' : '') + n; }
  function hariKey(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
  function labelHari(key){ var p = key.split('-'); var bln = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des']; return parseInt(p[2],10) + ' ' + bln[parseInt(p[1],10)-1]; }
  function jam(iso){ if (!iso) return ''; var d = new Date(iso); return isNaN(d) ? iso : pad2(d.getDate()) + '/' + pad2(d.getMonth()+1) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
  function median(a){ if (!a.length) return null; var s = a.slice().sort(function(x,y){return x-y;}); var m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1]+s[m])/2; }
  function p95(a){ if (!a.length) return null; var s = a.slice().sort(function(x,y){return x-y;}); return s[Math.min(s.length-1, Math.ceil(0.95*s.length)-1)]; }
  function durasi(menit){ if (menit == null) return '–'; if (menit < 60) return Math.round(menit) + 'm'; if (menit < 48*60) return (menit/60).toFixed(1) + 'j'; return (menit/1440).toFixed(1) + 'h'; }
  function pct(n, d){ return d ? Math.round(100*n/d) + '%' : '–'; }

  if (!DATA || DATA.versi !== 1) {
    document.body.insertBefore(el('p', 'peringatan', 'Data dashboard tidak terbaca atau versinya bukan 1. Jalankan ulang dashboard.ps1.'), document.body.firstChild);
    return;
  }

  var MIX_SLOT = { fix:'--s1', feat:'--s2', test:'--s3', docs:'--s4', refactor:'--s5', chore:'--s6' };
  var MIX_URUT = ['fix','feat','test','docs','refactor','chore'];
  var state = { rentang: 7, repo: '' };
  var now = new Date(DATA.dibuat || Date.now());

  $('waktu').textContent = 'dibuat ' + jam(DATA.dibuat) + ' · ' + DATA.hari + ' hari data' + (DATA.gh && !DATA.gh.ok ? ' · GH TIDAK TERSEDIA' : '');
  (DATA.repos || []).forEach(function(r){ var o = el('option', null, r); o.value = r; $('repo').appendChild(o); });

  document.querySelectorAll('[data-rentang]').forEach(function(b){
    b.addEventListener('click', function(){ state.rentang = parseInt(b.getAttribute('data-rentang'),10); document.querySelectorAll('[data-rentang]').forEach(function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); render(); });
  });
  $('repo').addEventListener('change', function(){ state.repo = $('repo').value; render(); });

  function hitung(){
    var awal = new Date(now); awal.setHours(0,0,0,0); awal.setDate(awal.getDate() - (state.rentang - 1));
    var hariList = []; for (var i = 0; i < state.rentang; i++){ var d = new Date(awal); d.setDate(awal.getDate()+i); hariList.push(hariKey(d)); }
    var pr = (DATA.pr || []).filter(function(p){ return !state.repo || p.repo === state.repo; });
    var dibuka = {}, merged = {}; hariList.forEach(function(h){ dibuka[h] = 0; merged[h] = 0; });
    var prDibuka = [], prMerged = [];
    pr.forEach(function(p){
      var c = new Date(p.createdAt), k = hariKey(c);
      if (c >= awal && dibuka.hasOwnProperty(k)) { dibuka[k]++; prDibuka.push(p); }
      if (p.mergedAt){ var m = new Date(p.mergedAt), km = hariKey(m); if (m >= awal && merged.hasOwnProperty(km)) { merged[km]++; prMerged.push(p); } }
    });
    var hariIni = hariKey(now); var kemarin = new Date(now); kemarin.setDate(kemarin.getDate()-1); var kmr = hariKey(kemarin);
    var cyc = prMerged.map(function(p){ return (new Date(p.mergedAt) - new Date(p.createdAt))/60000; });
    var mix = {}; prMerged.forEach(function(p){ var k = p.prefix || 'tanpa prefiks'; mix[k] = (mix[k]||0)+1; });
    var scope = {}; var tanpaScope = 0; prMerged.forEach(function(p){ if (p.scope) scope[p.scope] = (scope[p.scope]||0)+1; else tanpaScope++; });
    var perRepo = {}; prMerged.forEach(function(p){ (perRepo[p.repo] = perRepo[p.repo] || []).push((new Date(p.mergedAt) - new Date(p.createdAt))/60000); });
    return { hariList: hariList, dibuka: dibuka, merged: merged, prDibuka: prDibuka, prMerged: prMerged,
      dibukaHariIni: dibuka[hariIni]||0, dibukaKemarin: dibuka[kmr]||0, mergedHariIni: merged[hariIni]||0, mergedKemarin: merged[kmr]||0,
      cycMed: median(cyc), cycP95: p95(cyc), mix: mix, scope: scope, tanpaScope: tanpaScope, perRepo: perRepo, awal: awal };
  }

  function tile(parent, label, value, delta, deltaCls){
    var t = el('div','tile'); t.appendChild(el('div','l',label)); t.appendChild(el('div','v',value));
    if (delta != null) t.appendChild(el('div','d' + (deltaCls ? ' ' + deltaCls : ''), delta)); parent.appendChild(t); return t;
  }

  function renderShipped(h){
    var tiles = $('shipped-tiles'); clear(tiles);
    var dMerged = h.mergedHariIni - h.mergedKemarin;
    tile(tiles, 'MERGED HARI INI', h.mergedHariIni, (dMerged >= 0 ? '+' : '') + dMerged + ' vs kemarin', dMerged > 0 ? 'up' : (dMerged < 0 ? 'down' : ''));
    tile(tiles, 'MERGED KEMARIN', h.mergedKemarin);
    tile(tiles, 'DIBUKA ' + state.rentang + 'H', h.prDibuka.length);
    tile(tiles, 'MERGED ' + state.rentang + 'H', h.prMerged.length);
    tile(tiles, 'MERGE RATE', pct(h.prMerged.length, h.prDibuka.length), 'merged ÷ dibuka, rentang sama');
    tile(tiles, 'CYCLE MEDIAN', durasi(h.cycMed), 'p95 ' + durasi(h.cycP95));
    $('shipped-sub').textContent = state.rentang + ' hari' + (state.repo ? ' · ' + state.repo : ' · semua repo') + (DATA.gh && DATA.gh.terpotong && DATA.gh.terpotong.length ? ' · ⚠ sebagian irisan terpotong batas gh' : '');

    var wrap = $('shipped-chart'); clear(wrap);
    if (!(DATA.gh && DATA.gh.ok) && !(DATA.pr && DATA.pr.length)) { wrap.appendChild(el('p','kosong','Tidak ada data PR: ' + ((DATA.gh && DATA.gh.pesan) || 'gh tidak tersedia'))); return; }
    var W = Math.max(600, wrap.clientWidth || 900), H = 180, padL = 34, padR = 44, padT = 12, padB = 26;
    var xs = h.hariList, n = xs.length;
    var maxY = 1; xs.forEach(function(k){ maxY = Math.max(maxY, h.dibuka[k], h.merged[k]); });
    var stepY = maxY <= 5 ? 1 : (maxY <= 20 ? 5 : (maxY <= 50 ? 10 : (maxY <= 100 ? 20 : 50)));
    maxY = Math.ceil(maxY / stepY) * stepY;
    var X = function(i){ return padL + (n === 1 ? 0 : i * (W - padL - padR) / (n - 1)); };
    var Y = function(v){ return padT + (H - padT - padB) * (1 - v / maxY); };
    var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%', height: H, role: 'img', 'aria-label': 'PR dibuka dan merged per hari' });
    for (var g = 0; g <= maxY; g += stepY){ svg.appendChild(svgEl('line', { x1: padL, x2: W - padR, y1: Y(g), y2: Y(g), stroke: g === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 })); var t = svgEl('text', { x: padL - 6, y: Y(g) + 4, 'text-anchor': 'end' }); t.textContent = g; svg.appendChild(t); }
    var tick = n <= 8 ? 1 : (n <= 16 ? 2 : 5);
    xs.forEach(function(k, i){ if (i % tick === 0 || i === n - 1){ var t = svgEl('text', { x: X(i), y: H - 8, 'text-anchor': i === 0 ? 'start' : (i === n-1 ? 'end' : 'middle') }); t.textContent = labelHari(k); svg.appendChild(t); } });
    var seri = [ { nama: 'Dibuka', warna: 'var(--s1)', val: h.dibuka }, { nama: 'Merged', warna: 'var(--s2)', val: h.merged } ];
    seri.forEach(function(s){
      var pts = xs.map(function(k, i){ return [X(i), Y(s.val[k])]; });
      var d = pts.map(function(p, i){ return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
      svg.appendChild(svgEl('path', { d: d + ' L' + pts[n-1][0].toFixed(1) + ' ' + Y(0) + ' L' + pts[0][0].toFixed(1) + ' ' + Y(0) + ' Z', fill: s.warna, 'fill-opacity': 0.10, stroke: 'none' }));
      svg.appendChild(svgEl('path', { d: d, fill: 'none', stroke: s.warna, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
      var last = pts[n-1];
      svg.appendChild(svgEl('circle', { cx: last[0], cy: last[1], r: 6, fill: 'var(--surface)' }));
      svg.appendChild(svgEl('circle', { cx: last[0], cy: last[1], r: 4, fill: s.warna }));
      var lbl = svgEl('text', { x: last[0] + 9, y: last[1] + 4, 'text-anchor': 'start' }); lbl.textContent = s.val[xs[n-1]]; lbl.setAttribute('fill', 'var(--ink-2)'); svg.appendChild(lbl);
    });
    // label ujung yang bertumpuk didorong terpisah minimal 12px (leader tak perlu: keduanya di ujung yang sama)
    var labels = svg.querySelectorAll('text[fill]'); if (labels.length === 2){ var y1 = parseFloat(labels[0].getAttribute('y')), y2 = parseFloat(labels[1].getAttribute('y')); if (Math.abs(y1 - y2) < 12){ var mid = (y1 + y2)/2; labels[0].setAttribute('y', (mid - 6).toFixed(1)); labels[1].setAttribute('y', (mid + 6).toFixed(1)); } }
    var cross = svgEl('line', { x1: 0, x2: 0, y1: padT, y2: H - padB, stroke: 'var(--ink-2)', 'stroke-width': 1, opacity: 0 }); svg.appendChild(cross);
    var hit = svgEl('rect', { x: padL, y: padT, width: W - padL - padR, height: H - padT - padB, fill: 'transparent' }); svg.appendChild(hit);
    wrap.appendChild(svg);
    var tip = el('div','tip'); wrap.appendChild(tip);
    function tampil(i, clientX){
      var k = xs[i]; clear(tip);
      tip.appendChild(el('div', null, labelHari(k)));
      seri.forEach(function(s){ var row = el('div'); var key = el('span','k'); key.style.borderTopColor = s.warna; row.appendChild(key); var b = el('b', null, s.val[k]); row.appendChild(b); row.appendChild(el('span', null, ' ' + s.nama)); tip.appendChild(row); });
      tip.style.display = 'block'; var r = wrap.getBoundingClientRect(); var left = clientX - r.left + 12; if (left + 150 > r.width) left = clientX - r.left - 150; tip.style.left = left + 'px'; tip.style.top = '8px';
      cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('opacity', 0.5);
    }
    hit.addEventListener('pointermove', function(ev){ var r = svg.getBoundingClientRect(); var sx = (ev.clientX - r.left) * (W / r.width); var i = Math.round((sx - padL) / ((W - padL - padR) / Math.max(1, n - 1))); i = Math.max(0, Math.min(n - 1, i)); tampil(i, ev.clientX); });
    hit.addEventListener('pointerleave', function(){ tip.style.display = 'none'; cross.setAttribute('opacity', 0); });
    var lg = $('shipped-legend'); clear(lg);
    seri.forEach(function(s){ var it = el('span'); var k = el('span','k'); k.style.borderTopColor = s.warna; it.appendChild(k); it.appendChild(document.createTextNode(s.nama + ' ')); it.appendChild(el('span','n', s === seri[0] ? h.prDibuka.length : h.prMerged.length)); lg.appendChild(it); });
    var tbl = $('shipped-table'); clear(tbl); var t = el('table'); var thead = el('thead'); var tr = el('tr'); ['Hari','Dibuka','Merged'].forEach(function(x, i){ tr.appendChild(el('th', i ? 'num' : null, x)); }); thead.appendChild(tr); t.appendChild(thead); var tb = el('tbody');
    xs.forEach(function(k){ var r = el('tr'); r.appendChild(el('td', null, k)); r.appendChild(el('td','num', h.dibuka[k])); r.appendChild(el('td','num', h.merged[k])); tb.appendChild(r); }); t.appendChild(tb); tbl.appendChild(t);
  }

  function renderMix(h){
    var wrap = $('mix-chart'); clear(wrap); var lg = $('mix-legend'); clear(lg); var tbl = $('mix-table'); clear(tbl);
    var total = h.prMerged.length;
    if (!total){ wrap.appendChild(el('p','kosong','Belum ada PR merged di rentang ini.')); return; }
    var items = MIX_URUT.filter(function(k){ return h.mix[k]; }).map(function(k){ return { nama: k, n: h.mix[k], warna: 'var(' + MIX_SLOT[k] + ')' }; });
    var lain = 0; Object.keys(h.mix).forEach(function(k){ if (MIX_URUT.indexOf(k) < 0) lain += h.mix[k]; });
    if (lain) items.push({ nama: 'lainnya', n: lain, warna: 'var(--s-lain)' });
    var W = Math.max(300, wrap.clientWidth || 500), Hh = 20, gap = 2;
    var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + Hh, width: '100%', height: Hh, role: 'img', 'aria-label': 'Komposisi PR merged' });
    var x = 0; var lebarTotal = W - gap * (items.length - 1);
    var tip = el('div','tip');
    items.forEach(function(it, i){
      var w = lebarTotal * it.n / total; var r = svgEl('rect', { x: x.toFixed(1), y: 0, width: Math.max(0, w).toFixed(1), height: Hh, fill: it.warna, rx: i === items.length - 1 ? 4 : 0 });
      r.addEventListener('pointermove', function(ev){ clear(tip); var b = el('b', null, it.n + ' (' + pct(it.n, total) + ')'); tip.appendChild(b); tip.appendChild(el('span', null, ' ' + it.nama)); tip.style.display = 'block'; var rr = wrap.getBoundingClientRect(); tip.style.left = (ev.clientX - rr.left + 10) + 'px'; tip.style.top = '24px'; r.setAttribute('opacity', 0.85); });
      r.addEventListener('pointerleave', function(){ tip.style.display = 'none'; r.removeAttribute('opacity'); });
      svg.appendChild(r);
      if (w >= 44){ var t = svgEl('text', { x: (x + w/2).toFixed(1), y: 14, 'text-anchor': 'middle' }); t.textContent = pct(it.n, total); t.setAttribute('fill', '#ffffff'); svg.appendChild(t); }
      x += w + gap;
    });
    wrap.appendChild(svg); wrap.appendChild(tip);
    items.forEach(function(it){ var s = el('span'); var r = el('span','r'); r.style.background = it.warna; s.appendChild(r); s.appendChild(document.createTextNode(it.nama + ' ')); s.appendChild(el('span','n', it.n + ' · ' + pct(it.n, total))); lg.appendChild(s); });
    var t = el('table'); var tb = el('tbody'); items.forEach(function(it){ var r = el('tr'); r.appendChild(el('td', null, it.nama)); r.appendChild(el('td','num', it.n)); r.appendChild(el('td','num', pct(it.n, total))); tb.appendChild(r); }); t.appendChild(tb); tbl.appendChild(t);
  }

  function renderHotspots(h){
    var c = $('hotspots'); clear(c);
    var arr = Object.keys(h.scope).map(function(k){ return [k, h.scope[k]]; }).sort(function(a,b){ return b[1]-a[1]; }).slice(0, 12);
    if (!arr.length){ c.appendChild(el('p','kosong','Belum ada scope di judul PR merged pada rentang ini.')); }
    arr.forEach(function(x){ var ch = el('span','chip'); ch.appendChild(document.createTextNode(x[0].toUpperCase() + ' ')); ch.appendChild(el('b', null, '×' + x[1])); c.appendChild(ch); });
    $('hotspots-catatan').textContent = h.tanpaScope ? h.tanpaScope + ' PR merged tanpa scope di judulnya tidak masuk hitungan.' : '';
  }

  function renderLoop(){
    var tiles = $('loop-tiles'); clear(tiles); var list = $('loop-list'); clear(list);
    var briefs = (DATA.briefs || []).filter(function(b){ return !state.repo || b.repo === state.repo; });
    var judge = (DATA.judge || []);
    var awal = new Date(now); awal.setDate(awal.getDate() - state.rentang);
    var j7 = judge.filter(function(j){ return new Date(j.waktu) >= awal; });
    var lolos = j7.filter(function(j){ return j.lolos; }).length, gagal = j7.length - lolos;
    var pr = briefs.filter(function(b){ return b.status === 'pr'; }).length, gg = briefs.filter(function(b){ return b.status === 'gagal'; }).length;
    var percobaan = briefs.filter(function(b){ return b.percobaan; }).map(function(b){ return b.percobaan; });
    tile(tiles, 'BRIEF', briefs.length, pr + ' jadi PR · ' + gg + ' gagal');
    tile(tiles, 'JUDGE LOLOS ' + state.rentang + 'H', lolos);
    tile(tiles, 'JUDGE GAGAL ' + state.rentang + 'H', gagal);
    tile(tiles, 'RATA PERCOBAAN', percobaan.length ? (percobaan.reduce(function(a,b){return a+b;},0)/percobaan.length).toFixed(1) : '–', 'dari 3 maksimum');
    if (!briefs.length){ list.appendChild(el('p','kosong','Belum ada brief. Mulai dengan /brief <masalah>.')); return; }
    var t = el('table'); var th = el('thead'); var tr = el('tr'); ['STATUS','BRIEF','REPO','DOMAIN','PERCOBAAN','PR / TINDAK LANJUT'].forEach(function(x){ tr.appendChild(el('th', null, x)); }); th.appendChild(tr); t.appendChild(th); var tb = el('tbody');
    var prByUrl = {}; (DATA.pr || []).forEach(function(p){ if (p.url) prByUrl[p.url] = p; });
    briefs.sort(function(a,b){ return (b.tanggal||'').localeCompare(a.tanggal||''); }).forEach(function(b){
      var merged = b.pr_url && prByUrl[b.pr_url] && prByUrl[b.pr_url].mergedAt;
      var r = el('tr'); var st = el('td'); var s = el('span', 'status ' + (b.status === 'pr' ? 'good' : (b.status === 'gagal' ? 'serious' : 'muted')));
      s.appendChild(el('i', null, b.status === 'pr' ? '✓' : (b.status === 'gagal' ? '✗' : '…'))); s.appendChild(el('span', null, b.status === 'pr' ? (merged ? 'PR merged' : 'PR terbuka') : (b.status === 'gagal' ? 'GAGAL' : 'belum'))); st.appendChild(s); r.appendChild(st);
      r.appendChild(el('td', null, b.judul || b.berkas)); r.appendChild(el('td', null, b.repo || '')); r.appendChild(el('td', null, b.domain || ''));
      r.appendChild(el('td', 'num', b.percobaan ? b.percobaan + '/3' : '–'));
      var td = el('td'); if (b.pr_url){ var a = el('a', null, b.pr_url.replace(/^https?:\/\/github\.com\//, '')); a.href = b.pr_url; td.appendChild(a); } else if (b.status === 'gagal'){ td.textContent = (b.worktree ? b.worktree + ' · ' : '') + 'log: .task-plans/judge/' + b.slug + '-*.json'; } else { td.textContent = '/kerjakan ' + b.berkas; } r.appendChild(td);
      tb.appendChild(r);
    }); t.appendChild(tb); list.appendChild(t);
  }

  function renderCycle(h){
    var tiles = $('cycle-tiles'); clear(tiles);
    tile(tiles, 'MEDIAN', durasi(h.cycMed), h.prMerged.length + ' PR merged');
    tile(tiles, 'P95', durasi(h.cycP95));
    var tbl = $('cycle-table'); clear(tbl); var t = el('table'); var tb = el('tbody');
    Object.keys(h.perRepo).sort().forEach(function(r){ var row = el('tr'); row.appendChild(el('td', null, r)); row.appendChild(el('td','num', h.perRepo[r].length)); row.appendChild(el('td','num', durasi(median(h.perRepo[r])))); row.appendChild(el('td','num', durasi(p95(h.perRepo[r])))); tb.appendChild(row); });
    if (!Object.keys(h.perRepo).length){ var row = el('tr'); row.appendChild(el('td', 'kosong', 'tidak ada PR merged')); tb.appendChild(row); }
    t.appendChild(tb); tbl.appendChild(t);
  }

  function renderBaseline(){
    var tiles = $('baseline-tiles'); clear(tiles);
    var bl = (DATA.baseline || []).filter(function(b){ return !state.repo || b.repo === state.repo; });
    if (!bl.length){ tiles.appendChild(el('p','kosong','Belum ada baseline. Jalankan baseline-test.ps1 di checkout origin/main bersih.')); return; }
    bl.forEach(function(b){ tile(tiles, b.repo.toUpperCase() + ' GAGAL', b.jumlah_gagal, 'dari ' + b.jumlah_test + ' test · ' + (b.tanggal||'').slice(0,10) + ' @ ' + b.commit); });
  }

  function renderSesi(){
    var wrap = $('sesi-table'); clear(wrap);
    var sesi = (DATA.sesi || []).slice();
    var jamBasi = 24;
    sesi.forEach(function(s){ var t = s.terakhir ? new Date(s.terakhir) : null; s._basi = s.status === 'aktif' && t && (now - t) > jamBasi*3600000; s._keadaan = s._basi ? 'BASI' : (s.status === 'aktif' ? 'AKTIF' : 'selesai'); s._urut = s._basi ? 1 : (s.status === 'aktif' ? 0 : 2); });
    sesi.sort(function(a,b){ return a._urut - b._urut || (b.terakhir||'').localeCompare(a.terakhir||''); });
    var nA = sesi.filter(function(s){ return s._keadaan === 'AKTIF'; }).length, nB = sesi.filter(function(s){ return s._basi; }).length;
    $('sesi-sub').textContent = nA + ' aktif · ' + nB + ' basi (>' + jamBasi + 'j) · ' + sesi.length + ' total · worktree ' + (DATA.worktree || []).map(function(w){ return w.repo + ' ' + w.jumlah; }).join(', ');
    if (!sesi.length){ wrap.appendChild(el('p','kosong','Belum ada sesi terdaftar (kit ≥ 1.15.0 + restart sesi).')); return; }
    var t = el('table'); var th = el('thead'); var tr = el('tr'); ['KEADAAN','SESI','TAHAP','TASK','BRANCH','WORKTREE','TERAKHIR'].forEach(function(x){ tr.appendChild(el('th', null, x)); }); th.appendChild(tr); t.appendChild(th); var tb = el('tbody');
    sesi.forEach(function(s){ var r = el('tr', s._basi ? 'basi' : (s.status === 'aktif' ? 'aktif' : 'selesai')); [s._keadaan, (s.session_id||'').slice(0,8), s.tahap||'', (s.task||'').slice(0,60), s.branch||'', s.worktree||'', jam(s.terakhir)].forEach(function(v){ r.appendChild(el('td', null, v)); }); tb.appendChild(r); });
    t.appendChild(tb); wrap.appendChild(t);
  }

  function renderKaki(){
    var k = $('kaki'); clear(k);
    var baris = [];
    baris.push('Sumber: PR lewat gh (' + (DATA.gh && DATA.gh.ok ? 'hidup' : 'TIDAK: ' + ((DATA.gh && DATA.gh.pesan) || '-')) + (DATA.gh && DATA.gh.dari_cache ? ', dari cache ' + jam(DATA.gh.dari_cache) : '') + ') · brief .task-plans/briefs · judge .task-plans/judge · sesi .task-plans/sesi · baseline .agent-kit/baseline.');
    if (DATA.gh && DATA.gh.terpotong && DATA.gh.terpotong.length) baris.push('⚠ Irisan yang mencapai batas gh (angka di irisan itu KURANG dari kenyataan): ' + DATA.gh.terpotong.join(', ') + '.');
    baris.push('Tidak ada sumber datanya di sini, sengaja tidak ditampilkan: ' + (DATA.tanpa_sumber || []).join(', ') + '.');
    baris.push('Peristiwa GitHub se-organisasi ada di Papan Aktivitas Developer; dashboard ini lokal dan menambah sesi berjalan, brief, dan judge. Merge tetap manusia (ADR 0077 §1).');
    baris.forEach(function(b){ k.appendChild(el('p', null, b)); });
  }

  function render(){
    var h = hitung();
    renderShipped(h); renderMix(h); renderHotspots(h); renderLoop(); renderCycle(h); renderBaseline(); renderSesi(); renderKaki();
  }
  render();
  window.addEventListener('resize', function(){ var h = hitung(); renderShipped(h); renderMix(h); });
})();
</script>
</body>
</html>
